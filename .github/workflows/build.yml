name: Build (ROS 2 Jazzy)

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ros:jazzy-ros-base  # Official ROS 2 Jazzy image

    steps:
      - uses: actions/checkout@v4

      - name: Setup dependencies
        shell: bash
        run: |
          set -ex
          apt-get update
          apt-get install -y \
            python3-colcon-common-extensions \
            python3-rosdep \
            python3-vcstool \
            libopencv-dev

          # Initialize rosdep for dependency resolution
          rosdep init || true
          rosdep update

          # Install dependencies listed in package.xml automatically
          mkdir -p ~/ws/src
          cp -r . ~/ws/src/boson_camera
          cd ~/ws
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build boson_camera
        shell: bash
        run: |
          set -ex
          source /opt/ros/jazzy/setup.bash
          cd ~/ws
          colcon build --packages-select boson_camera
