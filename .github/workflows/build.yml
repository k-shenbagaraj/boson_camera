name: Build (ROS 2 Jazzy)

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ros:jazzy-ros-base  # official minimal ROS 2 Jazzy image

    steps:
      - uses: actions/checkout@v4

      - name: Setup dependencies
        shell: bash
        run: |
          set -ex
          apt-get update
          apt-get install -y software-properties-common curl gnupg2 lsb-release git

          # Core build & dev dependencies
          apt-get install -y \
            python3-colcon-common-extensions \
            python3-rosdep \
            python3-vcstool \
            ros-jazzy-image-transport \
            ros-jazzy-camera-info-manager \
            libopencv-dev build-essential \
            libboost-python3-dev libboost-system-dev 

          # Initialize rosdep safely
          rosdep init || true
          rosdep update

      - name: Build cv_bridge from source (fix for Jazzy)
        shell: bash
        run: |
          set -ex
          mkdir -p ~/ws/src
          cd ~/ws/src
          git clone -b humble https://github.com/ros-perception/vision_opencv.git
          cd ~/ws
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select cv_bridge

      - name: Install workspace dependencies
        shell: bash
        run: |
          set -ex
          mkdir -p ~/ws/src
          cp -r . ~/ws/src/boson_camera
          cd ~/ws
          source /opt/ros/jazzy/setup.bash
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build boson_camera
        shell: bash
        run: |
          set -ex
          source /opt/ros/jazzy/setup.bash
          source ~/ws/install/setup.bash  
          cd ~/ws
          colcon build --packages-select boson_camera --cmake-clean-cache

      - name: Verify cv_bridge installation
        shell: bash
        run: |
          set -ex
          if [ ! -f ~/ws/install/cv_bridge/include/cv_bridge/cv_bridge.h ]; then
            echo "cv_bridge header not found!"
            exit 1
          else
            echo "cv_bridge header found successfully."
          fi
