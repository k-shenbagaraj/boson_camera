name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ros_distro: [humble, iron, jazzy]  
    steps:
      - uses: actions/checkout@v4

      - name: Setup ROS 2 ${{ matrix.ros_distro }}
        uses: ros-tooling/setup-ros@v0.6
        with:
          required-ros-distributions: ${{ matrix.ros_distro }}

      - name: Build (colcon)
        shell: bash
        run: |
          set -euxo pipefail
          # create a workspace and build package
          mkdir -p ~/ws/src
          cp -r . ~/ws/src/boson_camera
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          cd ~/ws
          colcon build --packages-select boson_camera --event-handlers console_direct+
